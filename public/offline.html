<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#087dc1" />
    <title>ออฟไลน์ · ทริปพลูวิลล่าหรรษา</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #17435e; font-family: system-ui, sans-serif; background: linear-gradient(145deg, #e8f7fd, #fff); text-align: center; }
      main { max-width: 360px; padding: 32px; border: 1px solid #d5eaf4; border-radius: 24px; background: #ffffffeb; box-shadow: 0 18px 50px #235a7914; }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { color: #69869a; line-height: 1.7; margin: 0; }
      a { display: inline-block; margin-top: 22px; padding: 12px 18px; border-radius: 14px; color: white; background: #087dc1; text-decoration: none; font-weight: 700; }
      .mark { width: 58px; height: 58px; margin: auto; display: grid; place-items: center; border-radius: 18px; background: #087dc1; color: white; font-size: 26px; }
    </style>
  </head>
  <body><main><div class="mark">〰</div><h1>ตอนนี้ยังไม่ได้เชื่อมต่ออินเทอร์เน็ต</h1><p>ข้อมูลทริปจะโหลดเมื่อกลับมาออนไลน์ ลองเชื่อมต่อแล้วเปิดหน้านี้อีกครั้งนะ</p><a href="/">ลองอีกครั้ง</a></main></body>
</html>
